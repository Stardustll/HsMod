<style>
    .config-group { margin-bottom: 20px; border: 1px solid rgba(102, 204, 255, 0.3); border-radius: 8px; padding: 15px; }
    .config-group-title { font-size: 1.2em; font-weight: bold; color: #66CCFF; margin-bottom: 10px; cursor: pointer; }
    .config-group-title:hover { text-decoration: underline; }
    .config-item { display: flex; flex-wrap: wrap; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.1); }
    .config-item:last-child { border-bottom: none; }
    .config-item.advanced { background: rgba(255, 193, 7, 0.1); border-left: 3px solid #FFC107; padding-left: 12px; }
    .config-name { flex: 1; min-width: 200px; font-weight: bold; }
    .config-desc { flex: 2; min-width: 200px; font-size: 0.9em; color: #666; }
    .config-input { flex: 1; min-width: 150px; text-align: right; }
    .config-input input, .config-input select { padding: 5px; border: 1px solid #66CCFF; border-radius: 4px; }
    .config-input input[type='checkbox'] { width: 20px; height: 20px; }
    .config-input input[type='number'], .config-input input[type='text'], .config-input select { width: 100%; max-width: 200px; }
    .hidden { display: none !important; }
    .toast-success { background-color: #01FF70; }
    .toast-error { background-color: #FF4136; }
    .lang-selector { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; background: rgba(102, 204, 255, 0.1); border-radius: 4px; }
    .lang-selector select { padding: 4px 8px; border: 1px solid #66CCFF; border-radius: 4px; background: white; cursor: pointer; }
    .lang-selector label { font-size: 0.9em; color: #666; }
    .advanced-toggle { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; background: rgba(255, 193, 7, 0.1); border-radius: 4px; }
    .advanced-toggle input { width: 16px; height: 16px; cursor: pointer; }
    .advanced-toggle label { font-size: 0.9em; color: #666; cursor: pointer; }

    /* Modal styles */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 24px; border-radius: 8px; max-width: 400px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .modal-content h3 { color: #FF4136; margin-bottom: 16px; }
    .modal-content p { color: #666; margin-bottom: 20px; line-height: 1.5; }
    .modal-buttons { display: flex; gap: 12px; justify-content: center; }
    .modal-buttons button { padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .modal-btn-cancel { background: #eee; border: 1px solid #ccc; color: #666; }
    .modal-btn-confirm { background: #FF4136; border: none; color: white; }

    /* Control bar */
    .control-bar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px; }

    /* Tabs */
    .config-tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 15px; }
    .config-tab { padding: 8px 28px; border: 1px solid #66CCFF; border-radius: 20px; background: transparent; color: #66CCFF; cursor: pointer; font-size: 15px; transition: all .2s; }
    .config-tab:hover { background: rgba(102, 204, 255, 0.1); }
    .config-tab.active { background: #66CCFF; color: #fff; }

    /* Skin panel */
    .skin-types { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .skin-type-btn { padding: 6px 16px; border: 1px solid #66CCFF; border-radius: 16px; background: transparent; color: #66CCFF; cursor: pointer; font-size: 13px; }
    .skin-type-btn:hover { background: rgba(102, 204, 255, 0.1); }
    .skin-type-btn.active { background: #66CCFF; color: #fff; }
    .skin-class-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 10px; }
    .skin-class-btn { padding: 4px 12px; border: 1px solid #ccc; border-radius: 14px; background: transparent; color: #666; cursor: pointer; font-size: 12px; }
    .skin-class-btn:hover { border-color: #66CCFF; color: #66CCFF; }
    .skin-class-btn.active { background: #FFC107; border-color: #FFC107; color: #fff; }
    .skin-info-line { text-align: center; color: #888; font-size: 13px; margin-bottom: 10px; min-height: 20px; }
    .skin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; padding-bottom: 70px; }
    .skin-card { border: 2px solid #eee; border-radius: 8px; overflow: hidden; cursor: pointer; background: #fafafa; transition: border-color .15s, box-shadow .15s; }
    .skin-card:hover { border-color: #66CCFF; box-shadow: 0 2px 10px rgba(102, 204, 255, 0.25); }
    .skin-card.selected { border-color: #16b777; }
    .skin-card.mapping-source { border-color: #ff9800; box-shadow: 0 0 8px rgba(255, 152, 0, 0.5); }
    .skin-card.mapping-target { border-color: #ffc107; background: #fffbe6; }
    .skin-card.has-image .skin-thumb { display: block; }
    .skin-card .skin-thumb { display: none; width: 100%; height: 90px; object-fit: cover; background: #222; }
    .skin-card .skin-thumb-fallback { display: flex; width: 100%; height: 90px; align-items: center; justify-content: center; background: linear-gradient(135deg, #2c3e50, #4ca1af); color: rgba(255,255,255,0.75); font-size: 12px; }
    .skin-card .skin-info { padding: 6px 8px; }
    .skin-card .skin-id { font-size: 11px; color: #999; }
    .skin-card .skin-name { font-size: 13px; font-weight: bold; color: #333; margin: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .skin-card .skin-tag { font-size: 11px; color: #66CCFF; }
    .skin-card .skin-mapping { font-size: 11px; color: #ff9800; font-weight: bold; }
    .skin-empty { text-align: center; color: #999; padding: 30px; }
    /* 悬浮操作条 */
    .skin-floating { position: fixed; right: 24px; bottom: 24px; background: #1e293b; border: 1px solid #66CCFF; border-radius: 10px; padding: 10px 14px; box-shadow: 0 6px 24px rgba(0,0,0,0.35); display: flex; align-items: center; gap: 10px; z-index: 999; max-width: 90vw; }
    .skin-floating .skin-float-info { color: #ffc107; font-size: 13px; font-weight: bold; max-width: 340px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .skin-floating button { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .skin-btn-save { background: #16b777; color: #fff; }
    .skin-btn-delete { background: #ff5722; color: #fff; }
    .skin-btn-cancel { background: #475569; color: #fff; }
    .skin-btn-save:disabled, .skin-btn-delete:disabled { opacity: 0.4; cursor: not-allowed; }
</style>

    <div class="control-bar">
        <div class="lang-selector">
            <label>{config.page.language}:</label>
            <select id="lang-select" onchange="changeLanguage(this.value)">
                <option value="auto">{config.page.lang.auto}</option>
                <option value="enUS">English</option>
                <option value="zhCN">简体中文</option>
                <option value="zhTW">繁體中文</option>
                <option value="jaJP">日本語</option>
                <option value="koKR">한국어</option>
                <option value="deDE">Deutsch</option>
                <option value="frFR">Français</option>
                <option value="esES">Español</option>
                <option value="ruRU">Русский</option>
                <option value="ptBR">Português</option>
                <option value="itIT">Italiano</option>
                <option value="plPL">Polski</option>

</div>

<!-- 皮肤映射悬浮操作条 -->
<div id="skin-floating" class="skin-floating hidden">
    <div class="skin-float-info" id="skin-float-info"></div>
    <button class="skin-btn-save" id="skin-btn-save">{skin.saveMapping}</button>

</div>

<!-- Warning Modal -->

    <div class="modal-content">
        <h3>⚠️ {config.page.warning}</h3>
        <p>{config.page.warning.desc}</p>
        <div class="modal-buttons">
            <button class="modal-btn-cancel" onclick="cancelAdvanced()">{config.page.cancel}</button>
            <button class="modal-btn-confirm" onclick="confirmAdvanced()">{config.page.confirm}</button>

<div id="toast" style="display:none; position:fixed; bottom:20px; left:20px; padding:10px 20px; border-radius:4px; color:white;"></div>
<script src="/jquery.min.js"></script>
<script>
let configData = null;
let currentLang = 'auto';
let showAdvanced = false;
const i18n = {
    success: '{config.page.success}',
    error: '{config.page.error}'
};

// ===== 皮肤选择器 =====
const skinLang = {
    types: {
        cardBack: '{skinCardBack.name}', coin: '{skinCoin.name}', board: '{skinBoard.name}',
        bgsBoard: '{skinBgsBoard.name}', bgsFinisher: '{skinBgsFinisher.name}',
        hero: '{skinHero.name}', bgsHero: '{skin.bgsHero}', bob: '{skinBob.name}', pet: '{skinPet.name}'
    },
    current: '{skin.current}', empty: '{skin.empty}', loading: '{skin.loading}',
    noImage: '{skin.noImage}', all: '{skin.all}', mapTip: '{skin.mapTip}',
    saveMapping: '{skin.saveMapping}', deleteMapping: '{skin.deleteMapping}'
};
const skinTypes = ['cardBack', 'coin', 'board', 'bgsBoard', 'bgsFinisher', 'hero', 'bgsHero', 'bob', 'pet'];
const heroMappingTypes = ['hero', 'bgsHero'];
const skinImageTypes = ['hero', 'bgsHero', 'bob', 'coin', 'cardBack', 'bgsBoard'];    // 后端可出图的类型（pet 无卡牌图）

let skinState = {
    type: 'hero', items: [], curVal: -1, heroClass: '',
    source: -1, targets: []
};

function isHeroMappingType(t) { return heroMappingTypes.indexOf(t) >= 0; }

function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function showToast(message, isSuccess) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = isSuccess ? 'toast-success' : 'toast-error';
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 3000);
}

function skinImageUrl(type, id) {
    return '/skinimage?type=' + encodeURIComponent(type) + '&id=' + encodeURIComponent(id);
}

// 从 /api/config 数据中提取皮肤配置项当前值
function getSkinConfigValue(key) {
    if (!configData || !configData.groups) return -1;
    let val = -1;
    Object.keys(configData.groups).forEach(function (groupName) {
        configData.groups[groupName].forEach(function (item) {
            if (item.key === key && val === -1) val = parseInt(item.value, 10) || -1;
        });
    });
    return val;
}

function resetSkinSelection() {
    skinState.source = -1;
    skinState.targets = [];
    $('#skin-floating').addClass('hidden');
}

function updateSkinFloating() {
    const st = skinState;
    if (st.source < 0) { $('#skin-floating').addClass('hidden'); return; }
    const srcItem = st.items.find(i => String(i.id) === String(st.source));
    const srcName = srcItem ? srcItem.name : st.source;
    const targetsText = st.targets.length ? st.targets.join(', ') : skinLang.mapTip;
    $('#skin-float-info').text(srcName + ' → ' + targetsText);
    $('#skin-btn-save').prop('disabled', st.targets.length === 0);
    $('#skin-btn-delete').prop('disabled', !(srcItem && srcItem.mapping));
    $('#skin-floating').removeClass('hidden');
}

function skinPost(action, extra, cb) {
    const st = skinState;
    const payload = { action: action, type: st.type };
    Object.assign(payload, extra);
    $.ajax({
        url: '/api/skins', method: 'POST', contentType: 'application/json', data: JSON.stringify(payload),
        success: function (resp) {
            if (resp && resp.status === 200) {
                showToast(resp.output || 'ok', true);
                if (cb) cb();
            } else {
                showToast((resp && resp.output) || 'error', false);
            }
        },
        error: function () { showToast(i18n.error, false); }
    });
}

function renderSkinGrid() {
    const st = skinState;
    const grid = $('#skin-grid');
    if (!st.items.length) {
        grid.html('<div class="skin-empty">' + escapeHtml(skinLang.empty) + '</div>');
        return;
    }
    let html = '';
    st.items.forEach(function (item) {
        const hasImage = skinImageTypes.indexOf(st.type) >= 0;
        let cls = '';
        if (isHeroMappingType(st.type)) {
            //st.targets 为数字数组（来自 item.mapping/push(id)），必须用数字比较
            if (item.id === st.source) cls = ' mapping-source';
            else if (st.targets.indexOf(item.id) >= 0) cls = ' mapping-target';
            else if (item.mapping && item.mapping.length) cls = ' selected';
        } else {
            if (String(item.id) === String(st.curVal)) cls = ' selected';
        }
        if (hasImage) cls += ' has-image';    //.skin-thumb 默认 display:none，无此 class 图片永不显示
        const thumb = hasImage
            //loading="lazy" 对动态插入的图片在滚动容器内不触发加载，改用 IntersectionObserver（data-src）
            ? '<img class="skin-thumb" data-src="' + escapeHtml(skinImageUrl(st.type, item.id)) + '" alt="" ' +
              'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">' +
              '<div class="skin-thumb-fallback" style="display:none;">' + escapeHtml(skinLang.noImage) + '</div>'
            : '';
        const clsTag = (st.type === 'hero' || st.type === 'bgsHero') && item.heroClass
            ? '<div class="skin-tag">' + escapeHtml(item.heroClass) + '</div>' : '';
        const petTag = st.type === 'pet' && item.petId ? '<div class="skin-tag">宠物类型: ' + item.petId + '</div>' : '';
        let mapping = '';
        if (isHeroMappingType(st.type) && item.mapping && item.mapping.length)
            mapping = '<div class="skin-mapping">→ ' + escapeHtml(item.mapping.join(',')) + '</div>';
        html += '<div class="skin-card' + cls + '" data-id="' + item.id + '" title="' + escapeHtml(item.name) + '">' +
            thumb +
            '<div class="skin-info">' +
            '<div class="skin-id">' + item.id + '</div>' +
            '<div class="skin-name">' + escapeHtml(item.name) + '</div>' +
            clsTag + petTag + mapping +
            '</div></div>';
    });
    grid.html(html);
    setupSkinLazyImages();
}

// 图片懒加载：进入视口（提前300px）才设置 src 发起请求
let skinLazyObserver = null;
function setupSkinLazyImages() {
    if (skinLazyObserver) { skinLazyObserver.disconnect(); skinLazyObserver = null; }
    const imgs = document.querySelectorAll('#skin-grid img[data-src]');
    if (!imgs.length) return;
    if (!('IntersectionObserver' in window)) {
        imgs.forEach(i => { i.src = i.dataset.src; });
        return;
    }
    skinLazyObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
            if (!e.isIntersecting) return;
            const img = e.target;
            if (!img.src) img.src = img.dataset.src;
            skinLazyObserver.unobserve(img);
        });
    }, { rootMargin: '300px 0px' });
    imgs.forEach(i => skinLazyObserver.observe(i));
}

// 皮肤卡片点击（事件委托）
$('#skin-grid').on('click', '.skin-card', function () {
    const st = skinState;
    const id = parseInt($(this).attr('data-id'), 10);
    if (isHeroMappingType(st.type)) {
        // 映射模式：先点源皮肤，再点目标皮肤（多选）
        if (st.source < 0) {
            st.source = id;
            const item = st.items.find(i => i.id === id);
            st.targets = (item && item.mapping ? item.mapping.slice() : []);
            updateSkinFloating();
        } else if (id === st.source) {
            resetSkinSelection();
        } else {
            const idx = st.targets.indexOf(id);
            if (idx >= 0) st.targets.splice(idx, 1);
            else st.targets.push(id);
            updateSkinFloating();
        }
        renderSkinGrid();
    } else {
        // 直接设置：再次点击取消
        const newVal = st.curVal === id ? -1 : id;
        skinPost('set', { id: newVal }, function () {
            st.curVal = newVal;
            renderSkinGrid();
        });
    }
});

$('#skin-btn-save').on('click', function () {
    const st = skinState;
    if (st.source < 0 || !st.targets.length) return;
    skinPost('save', { src: st.source, targets: st.targets }, function () {
        const item = st.items.find(i => i.id === st.source);
        if (item) item.mapping = st.targets.slice();
        resetSkinSelection();
        renderSkinGrid();
    });
});

$('#skin-btn-delete').on('click', function () {
    const st = skinState;
    if (st.source < 0) return;
    skinPost('delete', { src: st.source }, function () {
        const item = st.items.find(i => i.id === st.source);
        if (item) item.mapping = null;
        resetSkinSelection();
        renderSkinGrid();
    });
});

$('#skin-btn-cancel').on('click', function () {
    resetSkinSelection();
    renderSkinGrid();
});

function renderSkinClassTabs() {
    const st = skinState;
    if (!isHeroMappingType(st.type)) {
        $('#skin-class-tabs').addClass('hidden').empty();
        return;
    }
    const classes = [];
    const seen = {};
    st.items.forEach(function (item) {
        if (item.heroClass && !seen[item.heroClass]) {
            seen[item.heroClass] = true;
            classes.push(item.heroClass);
        }
    });
    let html = '<span class="skin-class-btn' + (!st.heroClass ? ' active' : '') + '" data-class="">' + escapeHtml(skinLang.all) + '</span>';
    classes.forEach(function (cls) {
        html += '<span class="skin-class-btn' + (st.heroClass === cls ? ' active' : '') + '" data-class="' + escapeHtml(cls) + '">' + escapeHtml(cls) + '</span>';
    });
    $('#skin-class-tabs').html(html).removeClass('hidden');
}

$('#skin-class-tabs').on('click', '.skin-class-btn', function () {
    const cls = $(this).attr('data-class') || '';
    skinState.heroClass = cls;
    resetSkinSelection();
    $('#skin-class-tabs .skin-class-btn').removeClass('active');
    $(this).addClass('active');
    if (cls) {
        skinState.items = skinState.allItems.filter(function (i) { return i.heroClass === cls; });
    } else {
        skinState.items = skinState.allItems;
    }
    renderSkinGrid();
});

function loadSkinTab(type, force) {
    const st = skinState;
    if (!force && st.type === type && st.allItems) { setupSkinLazyImages(); return; }
    resetSkinSelection();
    st.type = type;
    st.allItems = null;
    st.items = [];
    st.curVal = isHeroMappingType(type) ? -1 : getSkinConfigValue('skin' + type.charAt(0).toUpperCase() + type.slice(1));
    st.heroClass = '';
    $('#skin-class-tabs').addClass('hidden').empty();
    $('#skin-info').text(skinLang.loading);
    $('#skin-grid').html('<div class="skin-empty">' + escapeHtml(skinLang.loading) + '</div>');

    $.ajax({
        url: '/api/skins?type=' + encodeURIComponent(type), method: 'GET', dataType: 'json',
        success: function (resp) {
            if (!resp || resp.success === false) {
                $('#skin-info').text('');
                $('#skin-grid').html('<div class="skin-empty">' + escapeHtml((resp && resp.error) || skinLang.empty) + '</div>');
                return;
            }
            const items = (resp.groups && resp.groups[type]) || [];
            st.allItems = items;
            st.items = items;
            st.curVal = isHeroMappingType(type) ? -1 : getSkinConfigValue('skin' + type.charAt(0).toUpperCase() + type.slice(1));
            $('#skin-info').text('');
            renderSkinClassTabs();
            renderSkinGrid();
        },
        error: function () {
            $('#skin-info').text('');
            $('#skin-grid').html('<div class="skin-empty">' + escapeHtml(skinLang.empty) + '</div>');
        }
    });
}

function initSkinPanel() {
    // 类型按钮
    const html = skinTypes.map(function (t) {
        return '<button class="skin-type-btn" data-type="' + t + '">' + escapeHtml(skinLang.types[t] || t) + '</button>';
    }).join('');
    $('#skin-types').html(html);
    $('#skin-types .skin-type-btn').removeClass('active');
    $('#skin-types .skin-type-btn[data-type="' + skinState.type + '"]').addClass('active');
    loadSkinTab(skinState.type);
}

$('#skin-types').on('click', '.skin-type-btn', function () {
    const t = $(this).attr('data-type');
    $('#skin-types .skin-type-btn').removeClass('active');
    $(this).addClass('active');
    loadSkinTab(t);
});

// ===== 配置页 =====

function detectBrowserLang() {
    const browserLang = navigator.language || navigator.userLanguage;
    const langMap = {
        'zh-CN': 'zhCN', 'zh-TW': 'zhTW', 'zh-HK': 'zhTW', 'zh': 'zhCN',
        'en': 'enUS', 'en-US': 'enUS', 'en-GB': 'enGB',
        'ja': 'jaJP', 'ko': 'koKR', 'de': 'deDE', 'fr': 'frFR',
        'es': 'esES', 'ru': 'ruRU', 'pt': 'ptBR', 'it': 'itIT', 'pl': 'plPL', 'th': 'thTH'
    };
    return langMap[browserLang] || langMap[browserLang.split('-')[0]] || 'enUS';
}

function getLangParam() {
    return currentLang === 'auto' ? detectBrowserLang() : currentLang;
}

function changeLanguage(lang) {
    currentLang = lang;
    loadConfig();
}

function toggleAdvancedWarning(checked) {
    if (checked) {
        document.getElementById('advanced-modal').style.display = 'flex';
        document.getElementById('show-advanced').checked = false;
    } else {
        showAdvanced = false;
        renderConfig(configData);
    }
}

function cancelAdvanced() {
    document.getElementById('advanced-modal').style.display = 'none';
    document.getElementById('show-advanced').checked = false;
}

function confirmAdvanced() {
    document.getElementById('advanced-modal').style.display = 'none';
    document.getElementById('show-advanced').checked = true;
    showAdvanced = true;
    renderConfig(configData);
}

function saveConfig(key, value) {
    fetch('/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: key + '.name', value: String(value) })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 200) {
            showToast(i18n.success, true);
        } else {
            showToast(i18n.error + ': ' + data.output, false);
        }
    })
    .catch(err => showToast(i18n.error + ': ' + err, false));
}

function createConfigInput(item) {
    const key = item.key;
    const type = item.type;
    const value = item.value;

    if (type === 'bool') {
        const checked = value.toLowerCase() === 'true' ? 'checked' : '';
        return `<input type='checkbox' ${checked} onchange="saveConfig('${key}', this.checked)">`;
    } else if (type === 'enum') {
        let options = item.enumValues.map(v => `<option value='${v}' ${v === value ? 'selected' : ''}>${v}</option>`).join('');
        return `<select onchange="saveConfig('${key}', this.value)">${options}</select>`;
    } else if (type === 'int' || type === 'long') {
        const min = item.min !== undefined ? `min='${item.min}'` : '';
        const max = item.max !== undefined ? `max='${item.max}'` : '';
        return `<input type='number' value='${value}' ${min} ${max} step='1' onchange="saveConfig('${key}', this.value)">`;
    } else if (type === 'float') {
        const min = item.min !== undefined ? `min='${item.min}'` : '';
        const max = item.max !== undefined ? `max='${item.max}'` : '';
        return `<input type='number' value='${value}' ${min} ${max} step='0.1' onchange="saveConfig('${key}', this.value)">`;
    } else if (type === 'keyboard') {
        return `<input type='text' value='${value}' onchange="saveConfig('${key}', this.value)" placeholder='e.g. LeftControl + D'>`;
    } else {
        return `<input type='text' value='${value}' onchange="saveConfig('${key}', this.value)">`;
    }
}

function renderConfig(data) {
    if (!data) return;
    configData = data;
    const container = document.getElementById('config-groups');
    container.innerHTML = '';

    const groups = data.groups;
    for (const groupName in groups) {
        const items = groups[groupName].filter(item => showAdvanced || !item.isAdvanced);
        if (items.length === 0) continue;

        const groupDiv = document.createElement('div');
        groupDiv.className = 'config-group';
        groupDiv.setAttribute('data-group', groupName);

        const titleDiv = document.createElement('div');
        titleDiv.className = 'config-group-title';
        titleDiv.textContent = groupName + ' (' + items.length + ')';
        titleDiv.onclick = function() {
            const content = this.nextElementSibling;
            content.style.display = content.style.display === 'none' ? 'block' : 'none';
        };
        groupDiv.appendChild(titleDiv);

        const contentDiv = document.createElement('div');
        contentDiv.className = 'config-group-content';

        items.forEach(item => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'config-item' + (item.isAdvanced ? ' advanced' : '');
            itemDiv.setAttribute('data-key', item.key);
            itemDiv.setAttribute('data-name', item.name.toLowerCase());
            itemDiv.setAttribute('data-desc', item.description.toLowerCase());

            itemDiv.innerHTML = `
                <div class='config-name'>${item.name}</div>
                <div class='config-desc'>${item.description}</div>
                <div class='config-input'>${createConfigInput(item)}</div>
            `;
            contentDiv.appendChild(itemDiv);
        });

        groupDiv.appendChild(contentDiv);
        container.appendChild(groupDiv);
    }
}

function filterConfig(keyword) {
    keyword = keyword.toLowerCase();
    document.querySelectorAll('.config-item').forEach(item => {
        const name = item.getAttribute('data-name');
        const desc = item.getAttribute('data-desc');
        const key = item.getAttribute('data-key').toLowerCase();
        if (name.includes(keyword) || desc.includes(keyword) || key.includes(keyword)) {
            item.classList.remove('hidden');
        } else {
            item.classList.add('hidden');
        }
    });

    document.querySelectorAll('.config-group').forEach(group => {
        const visibleItems = group.querySelectorAll('.config-item:not(.hidden)');
        if (visibleItems.length === 0) {
            group.classList.add('hidden');
        } else {
            group.classList.remove('hidden');
        }
    });
}

function loadConfig() {
    const lang = getLangParam();
    fetch('/api/config?lang=' + lang)
        .then(response => response.json())
        .then(data => renderConfig(data))
        .catch(err => console.error('Failed to load config:', err));
}

// Tab 切换
$('#tab-config').on('click', function () {
    $(this).addClass('active');
    $('#tab-skin').removeClass('active');
    $('#config-view').removeClass('hidden');
    $('#skin-view').addClass('hidden');
    $('#skin-floating').addClass('hidden');
});
$('#tab-skin').on('click', function () {
    $(this).addClass('active');
    $('#tab-config').removeClass('active');
    $('#config-view').addClass('hidden');
    $('#skin-view').removeClass('hidden');
    initSkinPanel();
    setupSkinLazyImages();    //容器刚显示，重新观察触发图片加载
});

document.addEventListener('DOMContentLoaded', function() {
    loadConfig();
    document.getElementById('search-input').addEventListener('input', function() {
        filterConfig(this.value);
    });
    initSkinPanel();
});
</script>
